name: CodeAutopsy Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run CodeAutopsy Action
        uses: Sidhant0707/codeautopsy-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Using your working Vercel deployment URL
          api_endpoint: 'https://codeautopsy-lyart.vercel.app/api/github-action'
